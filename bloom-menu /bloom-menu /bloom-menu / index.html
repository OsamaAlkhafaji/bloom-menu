<!DOCTYPE html>

<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#F7F2FD;--card:#FFFFFF;--ink:#54447A;--soft:#9A8DB8;--pink:#E4D9F6;--sage:#D5EBD8;--accent:#A98BDB;--line:#E7DEF4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231D30;--card:#2F2740;--ink:#EDE4FA;--soft:#B3A6CF;--pink:#4A3E66;--sage:#3C5342;--accent:#BFA5EC;--line:#3E3555}}
:root[data-theme="dark"]{--bg:#231D30;--card:#2F2740;--ink:#EDE4FA;--soft:#B3A6CF;--pink:#4A3E66;--sage:#3C5342;--accent:#BFA5EC;--line:#3E3555}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,sans-serif;line-height:1.6}
header{text-align:center;padding:28px 16px 12px}
header h1{margin:0;font-size:56px;font-weight:700;letter-spacing:3px;direction:ltr;position:relative;display:inline-block;line-height:1.2}
header h1 span{display:inline-block;background:linear-gradient(90deg,#A98BDB,#8FCB9B,#C9B2F0,#A98BDB);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wave 2.4s ease-in-out infinite,shine 5s linear infinite}
header h1 span:nth-child(2){animation-delay:.2s,-1s}header h1 span:nth-child(3){animation-delay:.4s,-2s}header h1 span:nth-child(4){animation-delay:.6s,-3s}header h1 span:nth-child(5){animation-delay:.8s,-4s}
header h1 .fl{position:absolute;top:50%;font-size:24px;pointer-events:none;animation:fly 5s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shine{to{background-position:300% 0}}
@keyframes fly{0%{left:-8%;opacity:0;transform:translateY(-50%) rotate(0)}15%,85%{opacity:1}100%{left:100%;opacity:0;transform:translateY(-50%) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){header h1 span,header h1 .fl{animation:none}}
header p{margin:0;color:var(--soft);font-size:16px;letter-spacing:3px;direction:ltr;font-weight:600}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line)}
nav button{flex:none;border:0;background:var(--pink);color:var(--ink);font:600 14px 'Cairo',Tahoma,sans-serif;padding:7px 16px;border-radius:20px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:6px 14px 30px}
section{scroll-margin-top:64px}
h2{font-size:22px;margin:26px 4px 10px;display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;margin-bottom:10px}
.pic{flex:none;width:88px;height:88px;border-radius:16px;background:var(--sage)}
.pic svg{width:100%;height:100%;display:block}
.item:nth-child(even) .pic{background:var(--pink)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:16px}
.txt small{display:block;color:var(--soft);font-size:13px;line-height:1.4}
.price{flex:none;background:var(--bg);border:1px dashed var(--accent);border-radius:14px;padding:4px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.qr{text-align:center;margin-top:30px;padding:18px;background:var(--card);border-radius:22px;border:1px solid var(--line)}
#qrbox{display:inline-block;background:#fff;padding:10px;border-radius:14px;margin-top:8px}
footer{text-align:center;color:var(--soft);font-size:13px;padding:6px 0 20px}
</style>
</head>

<script>
function sh(){return '<ellipse cx="50" cy="91" rx="34" ry="5" fill="#000" opacity=".08"/>';}
function badge(n){return '<circle cx="84" cy="18" r="13" fill="#A98BDB" stroke="#fff" stroke-width="2.5"/><text x="84" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="sans-serif">'+n+'</text>';}
function cookie(x,y,s,id){return '<use href="#'+(id||'cookie')+'" x="'+x+'" y="'+y+'" width="'+s+'" height="'+s+'"/>';}
function tray(n){
  var p=n==5?[[8,32],[36,24],[60,32],[22,50],[48,50]]:[[6,26],[32,20],[56,26],[10,44],[36,40],[60,44],[22,58],[48,58]];
